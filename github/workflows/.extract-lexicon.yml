name: Extract Lexicon Frontier V20

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure unzip is available
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Show repo root
        run: ls -la

      - name: Unzip Lexicon zip
        run: |
          if [ -f "Lexicon_Frontier_REALWORLD_V20.zip" ]; then
            unzip -o "Lexicon_Frontier_REALWORLD_V20.zip" -d extracted
          else
            echo "Lexicon_Frontier_REALWORLD_V20.zip not found in repo root" && exit 1
          fi

      - name: Move extracted contents to repo root
        run: |
          set -e
          shopt -s dotglob || true
          if [ -d extracted/lexicon_frontier ]; then
            echo "Found extracted/lexicon_frontier — moving its contents to repo root..."
            mv extracted/lexicon_frontier/* . || true
            mv extracted/lexicon_frontier/.[!.]* . || true || true
          else
            echo "No lexicon_frontier dir; moving all extracted files to repo root..."
            mv extracted/* . || true
          fi

      - name: Commit and push extracted files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add extracted Lexicon Frontier V20 project" || echo "No changes to commit"
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          echo "Pushing to branch: $BRANCH_NAME"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" HEAD:${BRANCH_NAME}
