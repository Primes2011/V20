name: Export Godot 4.7.2 Binary
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/export-godot-binary.yml'
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Download Godot 4.7.2
        run: |
          curl -L -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.7.2-stable_linux.x86_64 godot
          chmod +x godot
      - name: Upload Godot binary
        uses: actions/upload-artifact@v4
        with:
          name: godot-4.7.2-linux
          path: godot
          retention-days: 1
